[project]
name = "kit-evals"
version = "0.2.0"
description = "Evaluation harness for Kit. Not shipped in the agent container."
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
