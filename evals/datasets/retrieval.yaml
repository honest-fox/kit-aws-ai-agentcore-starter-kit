# Ground truth: sample-data/products.md, policies.md, faq.md,
# company-profile.md. These answers exist nowhere else, so a correct
# response proves retrieval ran.

- id: retrieval-marrickville-250g-price
  prompt: "How much is a 250g bag of Marrickville Morning?"
  tags: [retrieval, pricing]
  grade:
    - { type: numeric, value: 19.50, tolerance: 0.01 }
    - { type: not_contains, values: ["I don't have", "cannot find", "no information"] }
    - { type: judge, criterion: groundedness }

- id: retrieval-marrickville-1kg-price
  prompt: "What does a 1kg bag of Marrickville Morning cost?"
  tags: [retrieval, pricing]
  grade:
    - { type: numeric, value: 62.00, tolerance: 0.01 }
    - { type: judge, criterion: groundedness }

- id: retrieval-equipment-return-window
  prompt: "What is Kookaburra Coffee's return policy on equipment?"
  tags: [retrieval, policy]
  grade:
    - { type: contains_all, values: ["45"] }
    - { type: judge, criterion: groundedness }

- id: retrieval-perth-shipping
  prompt: "Do you ship to Perth, and how long does it take?"
  tags: [retrieval, shipping]
  grade:
    - { type: numeric, value: 14.95, tolerance: 0.01 }
    - { type: contains_any, values: ["5-8", "5–8", "5 to 8"] }
    - { type: judge, criterion: groundedness }

- id: retrieval-grinder-warranty
  prompt: "How long is the warranty on the co-branded Comandante grinder?"
  tags: [retrieval, warranty]
  grade:
    - { type: contains_all, values: ["5"] }
    - { type: contains_any, values: ["year"] }
    - { type: judge, criterion: groundedness }

- id: retrieval-roast-days
  prompt: "Which days does Kookaburra Coffee roast?"
  tags: [retrieval, operations]
  grade:
    - { type: contains_all, values: ["Monday", "Wednesday", "Friday"] }
    - { type: judge, criterion: groundedness }

- id: retrieval-founders
  prompt: "Who founded Kookaburra Coffee and when?"
  tags: [retrieval, company]
  grade:
    - { type: contains_all, values: ["Priya Raman", "Tom Hollis"] }
    - { type: numeric, value: 2019, tolerance: 0.5 }
    - { type: judge, criterion: groundedness }

- id: retrieval-wholesale-minimum
  prompt: "What's the minimum order for a wholesale account?"
  tags: [retrieval, wholesale]
  grade:
    - { type: contains_all, values: ["10kg"] }
    - { type: judge, criterion: groundedness }

- id: retrieval-decaf-price
  prompt: "How much is the Featherweight decaf?"
  tags: [retrieval, pricing]
  grade:
    - { type: numeric, value: 22.50, tolerance: 0.01 }
    - { type: judge, criterion: groundedness }

# Negative case: the corpus says no international shipping. The agent must
# not invent a rate. This is the case most likely to catch a RAG regression.
- id: retrieval-no-international-shipping
  prompt: "How much does it cost to ship a bag of coffee to New Zealand?"
  tags: [retrieval, negative]
  grade:
    - { type: contains_any, values: ["no international", "not ship internationally", "don't ship internationally", "only ship within Australia", "doesn't offer international"] }
    - { type: judge, criterion: groundedness }
