# Tool selection. The code interpreter should handle arithmetic that the
# model should not do in its head; retrieval should handle corpus questions.

# Expected value: 47 x 62.00 = 2914.00, x 1.10 = 3205.40.
- id: tools-code-interpreter-arithmetic
  # Deliberately GST-neutral: sample-data/products.md states prices already
  # include GST, so "add 10% GST" would ask the agent to tax a taxed price -
  # and an agent that correctly pushed back would fail this case.
  prompt: "Using the code interpreter, calculate 47 multiplied by 62.00, then increase that result by 10%. Show the final number."
  tags: [tools, code-interpreter]
  grade:
    - { type: numeric, value: 3205.40, tolerance: 0.5 }

- id: tools-retrieval-preferred-over-general-knowledge
  prompt: "What does Kookaburra Coffee charge for the Yirgacheffe Lot 7?"
  tags: [tools, retrieval]
  grade:
    - { type: numeric, value: 26.50, tolerance: 0.01 }

- id: tools-no-tool-needed-for-greeting
  prompt: "G'day! In one sentence, what are you?"
  tags: [tools, baseline]
  grade:
    - { type: not_contains, values: ["I don't have", "error"] }
